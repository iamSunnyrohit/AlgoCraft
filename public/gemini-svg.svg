<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dark-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="5" y="5" width="110" height="110" rx="24" fill="url(#bg-dark-card)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Left Code Bracket (Cyan Pivot) -->
  <path d="M 32 35 L 18 60 L 32 85" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Visualizer Array Bars -->
  <!-- Bar 1: Compare Left -->
  <rect x="42" y="48" width="6" height="28" rx="2" fill="#f59e0b"/>
  <!-- Bar 2: Swap Action -->
  <rect x="52" y="32" width="6" height="44" rx="2" fill="#ea580c"/>
  <!-- Bar 3: Overwrite Mutation -->
  <rect x="62" y="40" width="6" height="36" rx="2" fill="#a855f7"/>
  <!-- Bar 4: Sorted State -->
  <rect x="72" y="25" width="6" height="51" rx="2" fill="#ffffff"/>

  <!-- Right Code Bracket (Bright Orange Compare) -->
  <path d="M 88 35 L 102 60 L 88 85" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
